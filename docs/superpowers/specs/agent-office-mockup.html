<title>Agent Office</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: control-room chrome around one live floor plan; inspector docks right, hook event feed runs under the map */
:root {
  color-scheme: dark;
  --bg: #11131a;
  --panel: #181b25;
  --panel-2: #212534;
  --line: #2c3142;
  --fg: #ebe7dc;
  --muted: #9a9db0;
  --accent: #f2b84b;
  --ok: #62d391;
  --info: #7aa9ff;
  --danger: #ef6b6b;
  --display: "Pixelify Sans", ui-monospace, Menlo, monospace;
  --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 14px;
  line-height: 1.45;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin-bottom: 14px; }
.brand h1 { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1; margin: 0; letter-spacing: .5px; }
.brand p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: 500 12px var(--mono); padding: 4px 9px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip b { color: var(--fg); font-weight: 500; }
.chip.warn { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.chip.warn b { color: var(--accent); }
.styles { margin-left: auto; display: flex; flex-wrap: wrap; gap: 4px; background: var(--panel); border: 1px solid var(--line); padding: 4px; border-radius: 6px; }
.styles button { color: var(--muted); background: none; border: 0; padding: 7px 13px; border-radius: 4px; cursor: pointer; font-weight: 500; font-size: 13px; }
.styles button:hover { color: var(--fg); }
.styles button[aria-selected="true"] { background: var(--panel-2); color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }

.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.stage { min-width: 0; }
.map-wrap { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #0c0d12; }
#map { display: block; width: 100%; touch-action: manipulation; }
.note { color: var(--muted); font-size: 13px; margin: 10px 2px 0; max-width: 80ch; }
.note b { color: var(--fg); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 2px 0; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.feed { margin-top: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.feed header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.feed h2 { margin: 0; font: 600 13px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.feed header span { font-size: 12px; color: var(--muted); }
#feed { list-style: none; margin: 0; padding: 4px 0; max-height: 210px; overflow: auto; font: 12px/1.5 var(--mono); }
#feed li { display: grid; grid-template-columns: 64px 128px minmax(0, 1fr); gap: 10px; padding: 2px 14px; }
#feed li .t { color: var(--muted); font-variant-numeric: tabular-nums; }
#feed li .k { color: var(--muted); }
#feed li .k[data-k="SessionStart"] { color: var(--ok); }
#feed li .k[data-k="SubagentStart"], #feed li .k[data-k="SubagentStop"] { color: var(--info); }
#feed li .k[data-k="Notification"] { color: var(--accent); }
#feed li .k[data-k="UserPromptSubmit"] { color: var(--fg); }
#feed li .d { overflow-wrap: anywhere; }
@media (max-width: 560px) { #feed li { grid-template-columns: 58px minmax(0, 1fr); } #feed li .k { grid-column: 2; } #feed li .d { grid-column: 2; } }

.inspector { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 14px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); min-width: 0; }
@media (max-width: 1000px) { .layout { grid-template-columns: minmax(0, 1fr); } .inspector { position: static; } }
.insp-head { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
#avatar { width: 48px; height: 48px; image-rendering: pixelated; background: var(--panel-2); border-radius: 4px; }
.insp-head h2 { margin: 0; font: 600 20px/1.1 var(--display); }
.insp-head p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; }
.pill { font: 500 11.5px var(--mono); padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.pill[data-s="working"]::before { background: var(--ok); }
.pill[data-s="walking"]::before, .pill[data-s="talking"]::before { background: var(--info); }
.pill[data-s="waiting"] { border-color: var(--accent); color: var(--accent); }
.pill[data-s="waiting"]::before { background: var(--accent); }
.pending { border: 1px solid var(--accent); border-radius: 6px; padding: 12px; background: color-mix(in srgb, var(--accent) 8%, var(--panel)); display: grid; gap: 8px; }
.pending p { margin: 0; font-size: 13px; }
.pending code { font: 12.5px var(--mono); background: var(--bg); padding: 6px 8px; border-radius: 4px; overflow-wrap: anywhere; }
.btns { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #1b1608; }
.facts { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 6px 10px; margin: 0; font-size: 13px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; overflow-wrap: anywhere; }
.facts dd.mono { font: 12.5px var(--mono); }
.conn { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); }
.tabs button { background: none; border: 0; padding: 7px 10px; cursor: pointer; color: var(--muted); font-weight: 500; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.thread { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; max-height: 190px; overflow: auto; }
.thread li { font-size: 13px; padding: 7px 10px; border-radius: 6px; background: var(--panel-2); max-width: 92%; overflow-wrap: anywhere; }
.thread li.you { align-self: flex-end; background: color-mix(in srgb, var(--accent) 18%, var(--panel-2)); }
.thread li small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
.thread .empty { background: none; color: var(--muted); padding: 0; font-size: 12.5px; }
form.send { display: flex; gap: 6px; margin-top: 8px; }
form.send input { flex: 1; min-width: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; font-size: 13px; }
.insp h3 { margin: 0 0 6px; font: 600 12px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.log { list-style: none; margin: 0; padding: 0; font: 12px/1.6 var(--mono); color: var(--muted); }
.log li { overflow-wrap: anywhere; }
.log li:first-child { color: var(--fg); }
</style>

<header class="top">
  <div class="brand">
    <h1>Agent Office</h1>

  </div>

<div class="layout">
  <section class="stage">
    <div class="map-wrap" id="mapWrap"><canvas id="map" aria-label="Office floor with animated agents"></canvas></div>

    <div><h3>Recent activity</h3><ol class="log" id="iLog"></ol></div>

</div>

<script>
(() => {
'use strict';
// ---------- world ----------
const COLS = 48, ROWS = 30;
const grid = Array.from({ length: ROWS }, () => Array.from({ length: COLS }, () => ({ wall: true, room: null, block: false })));
const carve = (x0, y0, x1, y1, room) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { grid[y][x].wall = false; grid[y][x].room = room; } };
const ROOMS = {
  wingA: { name: 'agent-manager', x0: 2, y0: 2, x1: 15, y1: 11, doors: [[9, 12], [10, 12]] },
  mgr:   { name: 'Coordinator', x0: 19, y0: 2, x1: 28, y1: 11, doors: [[23, 12], [24, 12]] },
  wingB: { name: 'yt-pipeline', auto: true, x0: 32, y0: 2, x1: 45, y1: 11, doors: [[38, 12], [39, 12]] },
  wingC: { name: 'portfolio-site', x0: 2, y0: 18, x1: 20, y1: 27, doors: [[11, 17], [12, 17]] },
  brk:   { name: 'Break room', x0: 27, y0: 18, x1: 45, y1: 27, doors: [[33, 17], [34, 17]] },
};
carve(1, 13, 46, 16, 'hall');
carve(22, 17, 25, 28, 'hall');
for (const [id, r] of Object.entries(ROOMS)) {
  carve(r.x0, r.y0, r.x1, r.y1, id);
  for (const [x, y] of r.doors) { carve(x, y, x, y, 'hall'); grid[y][x].door = true; }
}
const FURN = [];
function furn(type, x, y, w, h, room, extra = {}) {
  const f = { type, x, y, w, h, room, ...extra };
  FURN.push(f);
  if (!f.decor) for (let yy = y; yy < y + h; yy++) for (let xx = x; xx < x + w; xx++) grid[yy][xx].block = true;
  return f;
}
for (const [x, y] of [[3, 3], [7, 3], [11, 3], [3, 7], [7, 7], [11, 7]]) furn('desk', x, y, 2, 1, 'wingA');
for (const [x, y] of [[33, 3], [37, 3], [41, 3], [33, 7], [37, 7], [41, 7]]) furn('desk', x, y, 2, 1, 'wingB');
for (const [x, y] of [[3, 19], [7, 19], [11, 19], [15, 19], [3, 23], [7, 23], [11, 23], [15, 23]]) furn('desk', x, y, 2, 1, 'wingC');
const BIGDESK = furn('bigdesk', 22, 4, 4, 1, 'mgr');
furn('table', 21, 8, 6, 2, 'mgr');
furn('shelf', 25, 2, 3, 1, 'mgr');
for (const [x, y, r] of [[2, 11, 'wingA'], [15, 11, 'wingA'], [32, 11, 'wingB'], [45, 11, 'wingB'], [19, 2, 'mgr'], [19, 11, 'mgr'], [28, 11, 'mgr'], [2, 27, 'wingC'], [20, 27, 'wingC'], [27, 27, 'brk'], [45, 27, 'brk']]) furn('plant', x, y, 1, 1, r);
furn('couch', 28, 18, 4, 1, 'brk');
furn('arcade', 40, 18, 1, 1, 'brk');
furn('fridge', 43, 18, 1, 1, 'brk');
furn('coffee', 45, 18, 1, 1, 'brk');
furn('roundtable', 35, 22, 2, 2, 'brk');
furn('board', 5, 1, 4, 1, 'wingA', { decor: true });
furn('board', 36, 1, 4, 1, 'wingB', { decor: true });
furn('board', 5, 17, 4, 1, 'wingC', { decor: true });
const ELEVATOR = { x: 23, y: 29 };
const BREAK_SPOTS = [[28, 19], [29, 19], [30, 19], [31, 19], [34, 21], [37, 21], [34, 24], [37, 24], [40, 19], [43, 19], [45, 19], [39, 23]];
const SKINS = ['#f1c9a5', '#e0ac85', '#c68863', '#9a6243', '#6e432b'];
const HAIRS = ['#2b1d16', '#5a3a22', '#c9a05a', '#1d1d26', '#8a3b2a', '#d8d2c4'];

const walkable = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS && !grid[y][x].wall && !grid[y][x].block;
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function bfs(sx, sy, tx, ty) {
  if (!walkable(tx, ty)) return null;
  const prev = new Int32Array(COLS * ROWS).fill(-1);
  const s = sy * COLS + sx, goal = ty * COLS + tx;
  const q = [s]; prev[s] = s;
  for (let h = 0; h < q.length; h++) {
    const c = q[h];
    if (c === goal) break;
    const cx = c % COLS, cy = (c / COLS) | 0;
    for (const [dx, dy] of DIRS) {
      const nx = cx + dx, ny = cy + dy;
      if (!walkable(nx, ny)) continue;
      const n = ny * COLS + nx;
      if (prev[n] !== -1) continue;
      prev[n] = c; q.push(n);
    }
  }
  if (prev[goal] === -1) return null;
  const out = [];
  for (let c = goal; c !== s; c = prev[c]) out.push({ x: c % COLS, y: (c / COLS) | 0 });
  return out.reverse();
}

// ---------- roles & content ----------
const ROLE = {
  manager:   { label: 'Coordinator',   color: '#f2b84b' },
  frontend:  { label: 'Front end',     color: '#5b93f5' },
  backend:   { label: 'Back end',      color: '#2fb79c' },
  animation: { label: 'Animation',     color: '#d571d9' },
  security:  { label: 'Cybersecurity', color: '#ec5f5f' },
  imagegen:  { label: 'Image gen',     color: '#f38b3d' },
  writer:    { label: 'Script writer', color: '#9b80f2' },
  publisher: { label: 'Publisher',     color: '#53c6ea' },
  subagent:  { label: 'Subagent',      color: '#b4b9c9' },
};
const ACT = {
  manager: ['Splitting “wing signs” into 3 tasks', 'Routing audit request → Sentry', 'Reviewing Basalt’s diff', 'Updating the project board', 'Reading yt-pipeline run log'],
  frontend: ['Read src/components/OfficeMap.tsx', 'Edit src/components/AgentPanel.tsx', 'Bash(npm run dev)', 'Grep "useAgentStore"', 'Bash(npx playwright test)', 'Edit src/styles/tokens.css'],
  backend: ['Edit server/hooks.ts', 'Bash(curl localhost:4317/events)', 'Read server/db.ts', 'Edit server/ws.ts', 'Bash(npm test -- events)'],
  animation: ['Edit sprites/walk-cycle.ts', 'Read lib/tween.ts', 'Edit renderer/iso.ts', 'Bash(node scripts/pack-sprites.js)'],
  security: ['Grep "process.env"', 'Read server/auth.ts', 'Bash(npm audit --omit=dev)', 'Read .github/workflows/deploy.yml', 'Bash(semgrep --config auto)'],
  imagegen: ['Generate thumb_v3.png (1280×720)', 'Read briefs/ep-14.md', 'Upscale thumb_v3.png', 'Bash(ffmpeg -i frames/%03d.png)'],
  writer: ['Write scripts/ep-14.md', 'Read research/notes.md', 'WebSearch("tensor cores explained")', 'Edit scripts/ep-14.md'],
  publisher: ['Bash(yt upload ep-13.mp4 --dry-run)', 'Read schedule.json', 'Edit metadata/ep-13.json', 'Bash(ffprobe ep-13.mp4)'],
  subagent: ['Grep "onEvent"', 'Read docs/hooks.md', 'Glob "src/**/*.test.ts"', 'Read package.json'],
};
const PERMS = {
  manager: ['Spawn 2 agents in portfolio-site'], frontend: ['Bash(npm install framer-motion)'], backend: ['Bash(git push origin main)', 'Bash(rm -rf .data/events.db)'],
  animation: ['Bash(npm install pixi.js)'], security: ['Bash(nmap -sV localhost)', 'Read ~/.ssh/config'], imagegen: ['Bash(rm frames/*.png)'],
  writer: ['WebFetch(arxiv.org/abs/2106.09685)'], publisher: ['Bash(yt upload ep-13.mp4 --public)'], subagent: ['Bash(npm test)'],
};
const SUBKINDS = [
  { tag: 'explore', task: p => `Find every place ${p.name}'s change touches` },
  { tag: 'review', task: () => 'Review the current diff for regressions' },
  { tag: 'research', task: () => 'Look up the right ffmpeg flags' },
  { tag: 'tests', task: () => 'Write tests for the event parser' },
];
const LINES = {
  peer: [['Got a sec? This touches your code.', 'Sure, send me the diff.'], ['Does this API shape work for you?', 'Looks good. Ship it.', 'Merging.'], ['Main is red after my change.', 'Seeing it. One minute.'], ['Can I borrow your fixture?', "It's in test/fixtures."]],
  boss: [['How is “{task}” going?', 'Most of the way. {act} now.'], ['Can you take one more ticket?', 'After this one, yes.'], ['Anything blocking you?', 'Nope, all clear.']],
  report: [['Finished a chunk of {task}.', 'Nice. Grab the next one.'], ['I need a call on scope.', 'Keep it small. Ship v1.']],
  audit: [['Quick security pass on your inputs?', "Go ahead, it's in server/."], ['Found a key in a log line.', 'Yikes. Rotating it.']],
};
const fill = (s, a) => s.replace('{task}', a.task.length > 26 ? a.task.slice(0, 25) + '…' : a.task).replace('{act}', a.activity.split('(')[0].split(' ')[0]);

// ---------- agents ----------
let now = 0;
const agents = [];
let uid = 0;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const seatOf = d => ({ x: d.x + d.w / 2, y: d.y + d.h + 0.45 });
const tileOf = p => ({ x: Math.floor(p.x - 0.001), y: Math.floor(p.y) });

function addAgent(o) {
  const a = Object.assign({
    id: ++uid, kind: 'session', status: 'working', dir: 'up', path: [], onArrive: null, next: now + rand(2, 7),
    walkPhase: 0, bubble: null, log: [], chat: [], queue: [], pending: null, partner: null, goal: '',
    skin: pick(SKINS), hair: pick(HAIRS), born: now,
  }, o);
  if (a.desk) a.home = seatOf(a.desk);
  if (!a.x) { a.x = a.home.x; a.y = a.home.y; }
  a.activity = a.activity || pick(ACT[a.role]);
  agents.push(a);
  return a;
}
const desksIn = room => FURN.filter(f => f.type === 'desk' && f.room === room);
const ROSTER = [
  { name: 'Atlas', role: 'manager', room: 'mgr', desk: BIGDESK, task: 'Coordinating three projects', conn: 'office', model: 'claude-opus-5-5' },
  { name: 'Juniper', role: 'frontend', room: 'wingA', d: 0, task: 'Build the agent detail panel', conn: 'terminal', model: 'claude-opus-5-5' },
  { name: 'Basalt', role: 'backend', room: 'wingA', d: 2, task: 'Hook receiver for session events', conn: 'terminal', model: 'claude-sonnet-5-5' },
  { name: 'Kite', role: 'animation', room: 'wingA', d: 4, task: 'Four-direction walk cycle', conn: 'office', model: 'claude-sonnet-5-5' },
  { name: 'Quill', role: 'writer', room: 'wingB', d: 0, task: 'Script for ep. 14, “Why GPUs love matrices”', conn: 'office', model: 'claude-opus-5-5' },
  { name: 'Prism', role: 'imagegen', room: 'wingB', d: 2, task: 'Thumbnails for ep. 14', conn: 'office', model: 'claude-sonnet-5-5' },
  { name: 'Relay', role: 'publisher', room: 'wingB', d: 4, task: 'Schedule ep. 13 for Friday 9:00', conn: 'office', model: 'claude-haiku-5-5' },
  { name: 'Sentry', role: 'security', room: 'wingC', d: 1, task: 'Audit the contact form and API keys', conn: 'terminal', model: 'claude-opus-5-5' },
  { name: 'Wren', role: 'frontend', room: 'wingC', d: 4, task: 'Responsive project gallery', conn: 'terminal', model: 'claude-sonnet-5-5' },
  { name: 'Cobalt', role: 'backend', room: 'wingC', d: 6, task: 'Contact endpoint with rate limiting', conn: 'office', model: 'claude-sonnet-5-5' },
];
for (const r of ROSTER) addAgent({ ...r, desk: r.desk || desksIn(r.room)[r.d] });
const MANAGER = agents[0];
const byName = n => agents.find(a => a.name === n);

const timers = [];
